[build-system]
requires = ["setuptools>=42", "wheel", "setuptools_scm[toml]>=3.5.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.coverage.run]
branch = true
parallel = true
source = ["multivolumefile"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["if __name__ == .__main__.:", "pragma: no-cover", "@abstract", "def __repr__"]

[project]
name = "multivolumefile"
description = "multi volume file wrapper library"
keywords = ['multivolume', 'file']
license = {text = "LGPL-2.1-or-later"}
authors = [
    {name = 'Hiroshi Miura', email = 'miurahr@linux.com'}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["readme", "version"]

[project.urls]
Homepage = "https://codeberg.org/miurahr/multivolume"

[tool.black]
line-length = 125
target-version = ['py310']

[tool.isort]
known_first_party = ['multivolume']
known_third_party = ["docutils", "flake8", "pyannotate_runtime", "pytest", "setuptools", "sphinx", "yaml"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 125

[project.optional-dependencies]
test = [
      "pytest",
      "pytest-cov",
      "pyannotate",
      "coverage[toml]>=5.2",
      "hypothesis",
    ]
type = [
      "mypy",
      "mypy_extensions",
      ]
check = [
      "check-manifest",
      "flake8",
      "flake8-black",
      "readme-renderer",
      "pygments",
      "isort>=5.0.3",
      "twine",
    ]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = check, mypy, py310, report

[testenv]
passenv = PYTEST_ADDOPTS
extras = test
commands =
    python -m pytest -vv
depends =
    py310: clean, check
    report: py310

[flake8]
extend-ignore = E203, W503
ignore = F841

[pytest]
python_files = tests/test_*.py
timeout = 480

[testenv:check]
extras = check
ignore_errors=true
commands =
    check-manifest {toxinidir}
    flake8 multivolumefile tests setup.py
    isort --quiet --check-only --diff multivolumefile tests setup.py

[testenv:mypy]
extras = type
commands =
    mypy multivolumefile/

[testenv:clean]
deps = coverage[toml]>=6.0
skip_install = true
commands = coverage erase

[testenv:coveralls]
deps =
    coveralls
skip_install = true
commands =
    coveralls []

[testenv:report]
deps = coverage[toml]>=6.0
skip_install = true
commands =
    coverage report
    coverage html -d build/htmlcov

[gh-actions]
python =
    3.10: py310, check

"""
